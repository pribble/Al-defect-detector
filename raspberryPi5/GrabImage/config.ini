[Configuration]
time = 4
speed = 1300
camera_distance = 200

[detection]
; ============ 软处理开关 ============
; 1=启用软处理(背景建模+自适应二值化), 0=回退原硬处理(固定阈值100+SSIM)
use_soft_processing = 1
; 二值化策略: otsu | adaptive | fixed
binarize_mode = otsu
; Otsu 下限保护: 纯暗背景下 Otsu 阈值低于此值时强制用该值, 防把噪声当目标
otsu_min_threshold = 50
; adaptiveThreshold 参数 (binarize_mode=adaptive 时生效, blockSize 必须为奇数)
adaptive_block = 21
adaptive_c = 8
; 形态学: 开运算(去噪)/闭运算(填洞连块) 迭代次数
morph_open = 1
morph_close = 2
; 连通域最小面积占比 (过滤散乱高光小斑点)
min_component_area = 0.002

; ============ 背景建模 ============
; EMA 背景更新率 (越小越慢, 越抗瞬时扰动)
background_alpha = 0.03
; 基线: 初始化帧数 / 滚动窗口长度 (开机前 BASELINE_INIT_FRAMES 帧需空皮带暖机)
baseline_init_frames = 30
baseline_window = 60
; 触发 z-score 系数 (fg_ratio > 基线mean + trigger_k * std 即判定有目标)
trigger_k = 3.0
; 进入/退出连续确认帧数
trigger_confirm_frames = 3
; 标定模式进入阈值 (fg_ratio 语义)
cal_ratio_threshold = 0.01
; TRACKING 超时帧数: 进入跟踪后超过该帧数仍不回落, 强制取中间帧推理 (防铝片停
; 留在视野内导致状态机永久卡死、后续铝片不再触发)
tracking_timeout_frames = 90
; 可选: 是否额外 AND 归一化 SSIM 触发 (默认 0=关闭, SSIM 仅作观测)
use_ssim_gate = 0

[disc]
; ============ 圆形铝片识别 + 智能裁剪 ============
; 1=启用: 推理前定位铝片圆心, 以圆心为中心裁正方形(四周留黑边)再等比缩放到
;         300×300, 避免整帧 3:2 图被各向异性压缩导致缺陷变形; 0=回退旧行为(整帧缩放)
enabled = 1
; 定圆方法: mask(前景二值化外接圆, 默认, 抗反光) | hough(Canny+HoughCircles 圆弧投票)
method = mask
; 裁剪黑边: 四周背景留半径的多少倍 (0.10 = 半径的 10%)
margin_ratio = 0.10
; 半径合理性过滤: 半径须在 min_radius_ratio ~ max_radius_ratio × min(宽,高) 之间
min_radius_ratio = 0.15
max_radius_ratio = 0.50
; 圆形度下限 (mask 方法: 凸包面积/(πr²)), 过滤机械臂等非圆亮斑
circularity = 0.60
; mask 方法二值化: 0=Otsu 自适应(带 otsu_min_threshold 下限保护); >0=固定阈值
mask_threshold = 0
otsu_min_threshold = 50
; 1=在保存的标注图/调试流上画绿色圆与黄色裁剪框(现场调参用), 0=不画
draw_overlay = 1
; ---- hough 方法参数 (method=hough 时生效) ----
hough_param1 = 100
hough_param2 = 30
; 圆心最小间距 (0=自动取 max(宽,高)/4)
hough_min_dist = 0
; 主方法未检出时是否尝试另一方法 (1=是; mask 优先背景差分, 再回退原始阈值/hough)
method_fallback = 1
; 裁剪最低完整度: 检出的圆在画面内占比低于此值时回退整帧 (铝片未完整进入视野,
; 硬裁会切掉铝片); 出界的圆不再直接拒绝, 由该门槛决定
min_completeness = 0.7
; 横向居中优先级: 圆完整度 ≥ 此值的帧进入"完整帧"档, 档内选圆心最接近画面水平
; 中心的帧 (原长方形图中铝片横向最中间); 低于此值按完整度打分选帧
center_complete = 0.9

[defect_name]
ca_shang = 划痕
zhen_kong = 针孔
zang_wu = 脏污
zhe_zhou = 褶皱
zheng_chang = 正常

